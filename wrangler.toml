# wrangler.toml
name = "tracker-project"             # 与你的 Cloudflare Pages 项目名一致
compatibility_date = "2025-03-01"    # 建议保留

[site]
bucket = "./public"                  # mkdocs build 的输出目录

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1
