# wrangler.toml
name = "tracker-project"
compatibility_date = "2025-03-01"
pages_build_output_dir = "./public"
[site]
bucket = "./public"                  # mkdocs build 的输出目录

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1
