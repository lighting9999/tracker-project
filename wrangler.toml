# wrangler.toml
name = "tracker-project"
compatibility_date = "2025-04-01"
[site]               # mkdocs build 的输出目录
pages_build_output_dir = "./public"
[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1
