name: Tracker Check and Deploy

on:
  push:
  schedule:
    - cron: '0 */16 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tracker-pipeline
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    services:
      i2pd:
        image: purplei2p/i2pd:latest
        ports:
          - 4444:4444
          - 7656:7656
        env:
          I2PD_SAM_ENABLED: "true"
        options: >-
          --health-cmd "nc -z 127.0.0.1 4444 && nc -z 127.0.0.1 7656 || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 6

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Configure Git
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"

      # ---------- 1. 下载和合并 Tracker 源 ----------
      - name: Download and merge sources
        run: |
          mkdir -p webtracker/sources
          if [ -f "download_sources.txt" ]; then
            count=0
            while IFS= read -r url; do
              [[ -z "$url" || "$url" =~ ^# ]] && continue
              count=$((count+1))
              filename="source_${count}.txt"
              echo "⬇️ Downloading: $url → webtracker/sources/$filename"
              curl -sS --retry 2 --max-time 30 "$url" -o "webtracker/sources/$filename" || \
                echo "⚠️ Failed: $url"
            done < download_sources.txt
          fi

          true > webtracker/input_merged_raw.txt
          if [ -d "webtracker/sources" ]; then
            cat webtracker/sources/*.txt >> webtracker/input_merged_raw.txt
          fi
          if [ -f "direct_trackers.txt" ]; then
            cat direct_trackers.txt >> webtracker/input_merged_raw.txt
          fi

          sed -i 's/\(https\?:\/\/\|udp:\/\/\|ws:\/\/\|wss:\/\/\|dns:\/\/\)/\n\1/g' webtracker/input_merged_raw.txt

          cat webtracker/input_merged_raw.txt \
            | sed 's/\r$//' \
            | tr ',' '\n' \
            | sed 's/[[:space:]]*#.*//' \
            | sed 's/^[[:space:]]*//; s/[[:space:]]*$//' \
            | sed '/^$/d' \
            | sed '/?/! s|/announce[+ ][0-9]\{1,\}.*$|/announce|' \
            | grep -i "announce" \
            | sort -u \
            > webtracker/input_merged.txt

          rm -f webtracker/input_merged_raw.txt
          echo "✅ Cleaned file has $(wc -l < webtracker/input_merged.txt) lines"

      # ---------- 2. 编译统一 Go 检查器 ----------
      - name: Setup Go modules and build
        env:
          GOPROXY: "https://goproxy.cn,direct"
          GOSUMDB: "sum.golang.google.cn"
          GOCACHE: "/tmp/go-cache"
        run: |
          go mod tidy
          go mod download
          CGO_ENABLED=0 go build -v -ldflags="-s -w" -trimpath -gcflags="-l=4" -o tracker-checker main.go

      # ---------- 3. 运行检查器生成数据（public/ 目录） ----------
      - name: Run tracker checker
        run: |
          ./tracker-checker \
            -input webtracker/input_merged.txt \
            -workers 1000 \
            -retries 2 \
            -compact0-fallback \
            -insecure \
            -proxy socks5://localhost:4444 \
            -sam \
            -dns 1.1.1.1 \
            -dns-timeout 5s \
            -rate-limit 2000 \
            -output public
          echo "✅ Tracker check completed"

      # ---------- 4. 安装 Vue 依赖并构建前端 ----------
      - name: Install Vue dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Vue
        run: |
          cd frontend
          npm run build
          # 构建产物默认在 ../dist（根据 vite.config.js 的 outDir 设置）
          # 如果 outDir 未设置，则在 frontend/dist；我们假定设为 ../dist

      - name: Copy data files to dist
        run: |
          mkdir -p dist
          # 如果 Vue 构建输出在 frontend/dist，则移动或复制到根目录 dist
          if [ -d "frontend/dist" ]; then
            mv frontend/dist/* dist/
          elif [ -d "dist" ]; then
            # 已存在则直接使用
            echo "dist already exists"
          else
            echo "ERROR: Vue build output not found"
            exit 1
          fi
          # 复制 Go 生成的 TXT 和 JSON 到 dist
          cp public/*.txt dist/ 2>/dev/null || true
          cp public/trackers.json dist/ 2>/dev/null || true
          # 复制 robots.txt 如果需要
          if [ -f "robots.txt" ]; then
            cp robots.txt dist/
          fi

      # ---------- 5. 部署到 Cloudflare Pages ----------
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/ --project-name=${{ secrets.CF_PAGES_PROJECT_NAME }} --branch=${{ github.ref_name }}

      # ---------- 6. 提交更新的数据文件到仓库 ----------
      - name: Commit updated files
        run: |
          date +'%Y%m%d%H' > date.txt
          # 将生成的数据文件（除了 public/ 下的前端资源）添加到仓库
          git add trackers_all.txt trackers_best*.txt trackers_alive_*.txt \
                   trackers_peers.txt tracker_history.tsv date.txt \
                   public/trackers.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes, skip commit."
            exit 0
          fi
          git commit -m "Update trackers $(date +'%Y-%m-%d %H:%M') [skip ci]"
          for i in 1 2 3; do
            git pull --rebase --autostash origin ${{ github.ref_name }} && git push && break
            sleep 5
          done