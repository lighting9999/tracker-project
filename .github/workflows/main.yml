name: Tracker Check and Deploy

on:
  push:
  schedule:
    - cron: '0 */16 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tracker-pipeline
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Configure Git
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"

      - name: Download and merge sources (curl)
        run: |
          mkdir -p webtracker/sources
          if [ -f "download_sources.txt" ]; then
            count=0
            while IFS= read -r url; do
              [[ -z "$url" || "$url" =~ ^# ]] && continue
              count=$((count+1))
              filename="source_${count}.txt"
              echo "⬇️ Downloading: $url → webtracker/sources/$filename"
              curl -sS --retry 2 --max-time 30 "$url" -o "webtracker/sources/$filename" || \
                echo "⚠️ Failed: $url"
            done < download_sources.txt
          fi

          true > webtracker/input_merged_raw.txt
          if [ -d "webtracker/sources" ]; then
            cat webtracker/sources/*.txt >> webtracker/input_merged_raw.txt
          fi
          if [ -f "direct_trackers.txt" ]; then
            cat direct_trackers.txt >> webtracker/input_merged_raw.txt
          fi

          cat webtracker/input_merged_raw.txt \
            | sed 's/\r$//' \
            | tr ',' '\n' \
            | sed 's/[[:space:]]*#.*//' \
            | sed 's/^[[:space:]]*//; s/[[:space:]]*$//' \
            | sed '/^$/d' \
            | sort -u \
            > webtracker/input_merged.txt

          rm -f webtracker/input_merged_raw.txt
          echo "✅ Cleaned file has $(wc -l < webtracker/input_merged.txt) lines"

      - name: Build Go tracker checker & JSON generator
        run: go build -o tracker-checker build.go

      - name: Run tracker checker
        run: ./tracker-checker -input webtracker/input_merged.txt -output trackers_best.txt -workers 200 -json-output jekyll/_data/trackers.json

      - name: Setup Ruby and Jekyll
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: jekyll

      - name: Build Jekyll site
        run: |
          cd jekyll
          bundle install
          bundle exec jekyll build --destination ../public

      - name: Copy tracker download files to public
        run: |
          cp trackers_all.txt trackers_best*.txt public/

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public/ --project-name=${{ secrets.CF_PAGES_PROJECT_NAME }} --branch=${{ github.ref_name }}

      - name: Commit updated files
        run: |
          date +'%Y%m%d%H' > date.txt
          rm -rf public/ _site/ jekyll/_site/
          git add trackers_all.txt trackers_best*.txt tracker_history.tsv date.txt
          if git diff --cached --quiet; then
            echo "No changes, skip commit."
            exit 0
          fi
          git commit -m "Update trackers $(date +'%Y-%m-%d %H:%M') [skip ci]"
          for i in 1 2 3; do
            git pull --rebase --autostash origin ${{ github.ref_name }} && git push && break
            sleep 5
          done
