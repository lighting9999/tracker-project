name: Tracker Check and Deploy

on:
  push:
  schedule:
    - cron: '0 */16 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tracker-pipeline
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================
      # 1. 准备 Go 环境（用于 checker）
      # ============================
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build Go checker
        run: |
          cd $GITHUB_WORKSPACE
          # 如果仓库中没有 go.mod，则自动初始化
          if [ ! -f go.mod ]; then
            go mod init tracker-checker
          fi
          go get github.com/gorilla/websocket
          go build -o tracker-checker .

      # ============================
      # 2. 准备 Python 环境（用于 build_docs.py）
      # ============================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore Python packages cache
        id: cache-python
        uses: actions/cache@v4
        with:
          path: ${{ env.pythonLocation }}/lib/python3.12/site-packages
          key: python-deps-${{ runner.os }}-${{ hashFiles('build_docs.py') }}

      - name: Install Python dependencies
        if: steps.cache-python.outputs.cache-hit != 'true'
        run: pip install aiohttp          # build_docs.py 不需要但可能其他用；实际仅需要标准库

      # ============================
      # 3. 配置 Git
      # ============================
      - name: Configure Git
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"

      # ============================
      # 4. 下载源文件并合并
      # ============================
      - name: Download and merge sources (curl)
        run: |
          mkdir -p webtracker/sources
          if [ -f "download_sources.txt" ]; then
            count=0
            while IFS= read -r url; do
              [[ -z "$url" || "$url" =~ ^# ]] && continue
              count=$((count+1))
              filename="source_${count}.txt"
              echo "⬇️ Downloading: $url → webtracker/sources/$filename"
              curl -sS --retry 2 --max-time 30 "$url" -o "webtracker/sources/$filename" || \
                echo "⚠️ Failed: $url"
            done < download_sources.txt
          fi

          true > webtracker/input_merged_raw.txt
          if [ -d "webtracker/sources" ]; then
            cat webtracker/sources/*.txt >> webtracker/input_merged_raw.txt
          fi
          if [ -f "direct_trackers.txt" ]; then
            cat direct_trackers.txt >> webtracker/input_merged_raw.txt
          fi

          cat webtracker/input_merged_raw.txt \
            | sed 's/\r$//' \
            | tr ',' '\n' \
            | sed 's/[[:space:]]*#.*//' \
            | sed 's/^[[:space:]]*//; s/[[:space:]]*$//' \
            | sed '/^$/d' \
            | sort -u \
            > webtracker/input_merged.txt

          rm -f webtracker/input_merged_raw.txt
          echo "✅ Cleaned file has $(wc -l < webtracker/input_merged.txt) lines"

      # ============================
      # 5. 运行 Go 版 tracker checker
      # ============================
      - name: Run tracker checker (Go)
        run: ./tracker-checker -input webtracker/input_merged.txt -output trackers_best.txt -workers 100

      # ============================
      # 6. 生成 Hugo 所需数据 + 复制静态文件
      # ============================
      - name: Prepare Hugo data and static files
        run: |
          mkdir -p hugo/static
          # build_docs.py 需要读取 trackers_all.txt 等文件，由 Go checker 已生成
          python build_docs.py --output-dir hugo/data
          cp trackers_all.txt trackers_best*.txt hugo/static/

      # ============================
      # 7. 安装 Hugo 并构建站点
      # ============================
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.126.0'
          extended: true

      - name: Build Hugo site
        run: |
          cd hugo
          hugo --destination ../public

      # ============================
      # 8. 部署到 Cloudflare Pages
      # ============================
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public/ --project-name=${{ secrets.CF_PAGES_PROJECT_NAME }} --branch=${{ github.ref_name }}

      # ============================
      # 9. 提交更新后的 tracker 数据文件
      # ============================
      - name: Commit updated files
        run: |
          date +'%Y%m%d%H' > date.txt
          # 清理临时产物，避免 git 干扰
          rm -rf source/ docs/ public/ hugo/public/
          git add trackers_all.txt trackers_best*.txt tracker_history.tsv date.txt
          if git diff --cached --quiet; then
            echo "No changes, skip commit."
            exit 0
          fi
          git commit -m "Update trackers $(date +'%Y-%m-%d %H:%M') [skip ci]"
          for i in 1 2 3; do
            git pull --rebase --autostash origin ${{ github.ref_name }} && git push && break
            sleep 5
          done
