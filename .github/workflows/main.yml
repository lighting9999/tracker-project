name: Tracker Check and Deploy

on:
  push:
  schedule:
    - cron: '0 */16 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tracker-pipeline
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    services:
      i2pd:
        image: purplei2p/i2pd:latest
        ports:
          - 4444:4444
          - 7656:7656
        env:
          I2PD_SAM_ENABLED: "true"
        options: >-
          --health-cmd "bash -c 'echo > /dev/tcp/127.0.0.1/4444 && echo > /dev/tcp/127.0.0.1/7656' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 6

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ---------- 1. Setup .NET 10 SDK ----------
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'          # .NET 10 发布 GA 后改为 'ga'
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Configure Git
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"

      # ---------- 2. 下载和合并 Tracker 源 ----------
      - name: Download and merge sources
        run: |
          mkdir -p webtracker/sources
          if [ -f "download_sources.txt" ]; then
            count=0
            while IFS= read -r url; do
              [[ -z "$url" || "$url" =~ ^# ]] && continue
              count=$((count+1))
              filename="source_${count}.txt"
              echo "⬇️ Downloading: $url → webtracker/sources/$filename"
              curl -sS --retry 2 --max-time 30 "$url" -o "webtracker/sources/$filename" || \
                echo "⚠️ Failed: $url"
            done < download_sources.txt
          fi

          true > webtracker/input_merged_raw.txt
          if [ -d "webtracker/sources" ]; then
            cat webtracker/sources/*.txt >> webtracker/input_merged_raw.txt
          fi
          if [ -f "direct_trackers.txt" ]; then
            cat direct_trackers.txt >> webtracker/input_merged_raw.txt
          fi

          sed -i 's/\(https\?:\/\/\|udp:\/\/\|ws:\/\/\|wss:\/\/\|dns:\/\/\)/\n\1/g' webtracker/input_merged_raw.txt

          cat webtracker/input_merged_raw.txt \
            | sed 's/\r$//' \
            | tr ',' '\n' \
            | sed 's/[[:space:]]*#.*//' \
            | sed 's/^[[:space:]]*//; s/[[:space:]]*$//' \
            | sed '/^$/d' \
            | sed '/?/! s|/announce[+ ][0-9]\{1,\}.*$|/announce|' \
            | grep -i "announce" \
            | sort -u \
            > webtracker/input_merged.txt

          rm -f webtracker/input_merged_raw.txt
          echo "✅ Cleaned file has $(wc -l < webtracker/input_merged.txt) lines"

      # ---------- 3. 编译 C# TrackerChecker (.NET 10) ----------
      - name: Restore & Publish TrackerChecker
        run: |
          dotnet restore TrackerChecker.csproj
          dotnet publish TrackerChecker.csproj \
            -c Release \
            -r linux-x64 \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:EnableCompressionInSingleFile=true \
            -p:PublishReadyToRun=true \
            -o ./publish
          # 将可执行文件复制到工作目录根，便于后续调用
          cp ./publish/TrackerChecker ./tracker-checker
          chmod +x ./tracker-checker

      # ---------- 4. 运行检查器生成数据（public/ 目录） ----------
      - name: Run tracker checker
        run: |
          ./tracker-checker \
            -input webtracker/input_merged.txt \
            -workers 1000 \
            -retries 2 \
            -compact0-fallback \
            -insecure \
            -proxy socks5://localhost:4444 \
            -sam \
            -dns "223.5.5.5,119.29.29.29,114.114.114.114,1.1.1.1,8.8.8.8,4.2.2.1" \
            -doh \
            -doh-servers "https://dns.alidns.com/dns-query,https://cloudflare-dns.com/dns-query,https://dns.google/dns-query" \
            -dns-timeout 5s \
            -rate-limit 500 \
            -output public
          echo "✅ Tracker check completed"

      # ---------- 5. 安装 Vue 依赖并构建前端 ----------
      - name: Install Vue dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Vue
        run: |
          cd frontend
          npm run build

      - name: Copy data files to dist
        run: |
          mkdir -p dist
          if [ -d "frontend/dist" ]; then
            mv frontend/dist/* dist/
          elif [ -d "dist" ]; then
            echo "dist already exists"
          else
            echo "ERROR: Vue build output not found"
            exit 1
          fi
          cp public/*.txt dist/ 2>/dev/null || true
          cp public/trackers.json dist/ 2>/dev/null || true
          if [ -f "robots.txt" ]; then
            cp robots.txt dist/
          fi

      # ---------- 6. 部署到 Cloudflare Pages ----------
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/ --project-name=${{ secrets.CF_PAGES_PROJECT_NAME }} --branch=${{ github.ref_name }}

      # ---------- 7. 提交更新的数据文件到仓库 ----------
      - name: Commit updated files
        run: |
          date +'%Y%m%d%H' > date.txt
          # C# 版输出在 public/ 下；同时保留根目录兼容路径（若存在）
          git add public/ date.txt 2>/dev/null || true
          git add trackers_all.txt trackers_best*.txt trackers_alive_*.txt \
                   trackers_peers.txt tracker_history.tsv 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes, skip commit."
            exit 0
          fi
          git commit -m "Update trackers $(date +'%Y-%m-%d %H:%M') [skip ci]"
          for i in 1 2 3; do
            git pull --rebase --autostash origin ${{ github.ref_name }} && git push && break
            sleep 5
          done