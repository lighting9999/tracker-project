name: Tracker Check and Deploy

on:
  push:
  schedule:
    - cron: '0 */16 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tracker-pipeline
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    services:
      i2pd:
        image: purplei2p/i2pd:latest
        ports:
          - 4444:4444
        env:
          I2PD_SAM_ENABLED: "false"
        options: >-
          --health-cmd "nc -z 127.0.0.1 4444 || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 6

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Configure Git
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"

      - name: Download and merge sources (curl)
        run: |
          mkdir -p webtracker/sources
          if [ -f "download_sources.txt" ]; then
            count=0
            while IFS= read -r url; do
              [[ -z "$url" || "$url" =~ ^# ]] && continue
              count=$((count+1))
              filename="source_${count}.txt"
              echo "⬇️ Downloading: $url → webtracker/sources/$filename"
              curl -sS --retry 2 --max-time 30 "$url" -o "webtracker/sources/$filename" || \
                echo "⚠️ Failed: $url"
            done < download_sources.txt
          fi

          true > webtracker/input_merged_raw.txt
          if [ -d "webtracker/sources" ]; then
            cat webtracker/sources/*.txt >> webtracker/input_merged_raw.txt
          fi
          if [ -f "direct_trackers.txt" ]; then
            cat direct_trackers.txt >> webtracker/input_merged_raw.txt
          fi

          sed -i 's/\(https\?:\/\/\|udp:\/\/\|ws:\/\/\|wss:\/\/\|dns:\/\/\)/\n\1/g' webtracker/input_merged_raw.txt

          cat webtracker/input_merged_raw.txt \
            | sed 's/\r$//' \
            | tr ',' '\n' \
            | sed 's/[[:space:]]*#.*//' \
            | sed 's/^[[:space:]]*//; s/[[:space:]]*$//' \
            | sed '/^$/d' \
            | grep -i "announce" \
            | sort -u \
            > webtracker/input_merged.txt

          rm -f webtracker/input_merged_raw.txt
          echo "✅ Cleaned file has $(wc -l < webtracker/input_merged.txt) lines"

      - name: Setup Go modules and build
        run: |
          if [ ! -f "go.mod" ]; then
            go mod init tracker-checker
          fi
          go mod tidy
          go build -o tracker-checker build.go

      - name: Run tracker checker
        run: |
          ./tracker-checker \
            -input webtracker/input_merged.txt \
            -output trackers_best.txt \
            -workers 1000 \
            -json-output jekyll/_data/trackers.json \
            -retries 1 \
            -compact0-fallback \
            -insecure \
            -proxy socks5://localhost:4444
          echo "Alive trackers: $(wc -l < trackers_best.txt)"
          if [ -f trackers_best_ipv6.txt ]; then
            echo "IPv6-capable alive trackers: $(wc -l < trackers_best_ipv6.txt)"
          fi
          if [ -f trackers_best_dual.txt ]; then
            echo "Dual-stack (IPv4+IPv6) alive trackers: $(wc -l < trackers_best_dual.txt)"
          fi

      - name: Download Bootstrap and assets
        run: |
          mkdir -p jekyll/assets/css jekyll/assets/js
          curl -sS -o jekyll/assets/css/bootstrap.min.css \
            https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css
          curl -sS -o jekyll/assets/js/bootstrap.bundle.min.js \
            https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js

      - name: Setup Ruby and Jekyll
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: jekyll

      - name: Build Jekyll site
        run: |
          cd jekyll
          bundle install
          bundle exec jekyll build --destination ../public

      - name: Copy tracker download files to public
        run: |
          cp trackers_all.txt trackers_best*.txt public/ 2>/dev/null || true
          if [ -f trackers_peers.txt ]; then cp trackers_peers.txt public/; fi

      - name: Generate robots.txt
        run: |
          cat > public/robots.txt <<EOF
          User-agent: *
          Allow: /
          Sitemap: https://tracker-list.pages.dev/sitemap.xml
          EOF

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public/ --project-name=${{ secrets.CF_PAGES_PROJECT_NAME }} --branch=${{ github.ref_name }}

      - name: Commit updated files
        run: |
          date +'%Y%m%d%H' > date.txt
          rm -rf public/ _site/ jekyll/_site/
          git add trackers_all.txt trackers_best*.txt trackers_peers.txt tracker_history.tsv date.txt 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes, skip commit."
            exit 0
          fi
          git commit -m "Update trackers $(date +'%Y-%m-%d %H:%M') [skip ci]"
          for i in 1 2 3; do
            git pull --rebase --autostash origin ${{ github.ref_name }} && git push && break
            sleep 5
          done