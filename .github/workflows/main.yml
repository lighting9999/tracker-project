name: Tracker Check and Deploy

on:
  push:
  schedule:
    - cron: '0 */16 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tracker-pipeline
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    services:
      i2pd:
        image: purplei2p/i2pd:latest
        ports:
          - 4444:4444      # published host port -> SOCKS5 proxy used by tracker-checker
          - 7656:7656      # published host port -> SAM bridge used by tracker-checker (-sam)
        # FIX 1 -- start SAM/SOCKS and bind them to 0.0.0.0 (container eth0):
        #   * I2PD_SAM_ENABLED=true was a no-op. i2pd is configured ONLY through
        #     command-line flags / i2pd.conf, never through environment variables,
        #     so SAM never started and :7656 had no listener inside the container.
        #   * SOCKS/SAM default to binding 127.0.0.1 INSIDE the container, while
        #     docker -p forwards the host port to the container eth0 address, not to
        #     the container loopback. So the runner could never reach
        #     socks5://localhost:4444, even if SOCKS had been running.
        # The dotted form below is current i2pd syntax: [sam] enabled=true in
        # i2pd.conf is equivalent to --sam.enabled=true on the command line.
        args: >-
          --sam.enabled=true
          --sam.address=0.0.0.0
          --sam.port=7656
          --socks.enabled=true
          --socks.address=0.0.0.0
          --socks.port=4444
          --log.level=info
        # FIX 2 -- no inline --health-cmd here. That probe could never succeed (see
        # FIX 1), so the container went starting -> unhealthy and the runner reported
        # "Service container i2pd failed", followed by the misleading placeholder
        # "Failed to initialize container" printed from the container's EMPTY stdout
        # (i2pd logs to a file, so docker logs yields nothing). Readiness is asserted
        # explicitly in the "Wait for i2pd SOCKS/SAM" step below.

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ---------- 0. Assert the i2pd service is really listening ----------
      # FIX 3 -- readiness moved from a container HEALTHCHECK into a runner step.
      # The runner always has bash + /dev/tcp; the image may not. Probing from the
      # host also validates the published port mapping end to end, which an
      # in-container HEALTHCHECK cannot do.
      - name: Wait for i2pd SOCKS/SAM
        run: |
          ready=0
          for i in $(seq 1 36); do
            if (exec 3<>/dev/tcp/127.0.0.1/7656) 2>/dev/null && \
               (exec 3<>/dev/tcp/127.0.0.1/4444) 2>/dev/null; then
              ready=1
              echo "i2pd SAM(:7656) and SOCKS(:4444) are reachable from the runner."
              break
            fi
            echo "waiting for i2pd ... attempt ${i}/36"
            sleep 5
          done
          if [ ${ready} != 1 ]; then
            echo "ERROR: i2pd never became ready; dumping container logs." >&2
            docker ps -a
            docker ps -q --filter ancestor=purplei2p/i2pd:latest | head -n1 | xargs -r docker logs
            exit 1
          fi

      # ---------- 1. Setup .NET 10 SDK ----------
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'          # .NET 10 发布 GA 后改为 'ga'
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Configure Git
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"

      # ---------- 2. 下载和合并 Tracker 源 ----------
      - name: Download and merge sources
        run: |
          mkdir -p webtracker/sources
          if [ -f "download_sources.txt" ]; then
            count=0
            while IFS= read -r url; do
              [[ -z "$url" || "$url" =~ ^# ]] && continue
              count=$((count+1))
              filename="source_${count}.txt"
              echo "Downloading: $url -> webtracker/sources/$filename"
              curl -sS --retry 2 --max-time 30 "$url" -o "webtracker/sources/$filename" || \
                echo "WARN Failed: $url"
            done < download_sources.txt
          fi

          true > webtracker/input_merged_raw.txt
          if [ -d "webtracker/sources" ]; then
            cat webtracker/sources/*.txt >> webtracker/input_merged_raw.txt
          fi
          if [ -f "direct_trackers.txt" ]; then
            cat direct_trackers.txt >> webtracker/input_merged_raw.txt
          fi

          sed -i 's/\(https\?:\/\/\|udp:\/\/\|ws:\/\/\|wss:\/\/\|dns:\/\/\)/\n\1/g' webtracker/input_merged_raw.txt

          cat webtracker/input_merged_raw.txt \
            | sed 's/\r$//' \
            | tr ',' '\n' \
            | sed 's/[[:space:]]*#.*//' \
            | sed 's/^[[:space:]]*//; s/[[:space:]]*$//' \
            | sed '/^$/d' \
            | sed '/?/! s|/announce[+ ][0-9]\{1,\}.*$|/announce|' \
            | grep -i "announce" \
            | sort -u \
            > webtracker/input_merged.txt

          rm -f webtracker/input_merged_raw.txt
          echo "Cleaned file has $(wc -l < webtracker/input_merged.txt) lines"

      # ---------- 3. 编译 C# TrackerChecker (.NET 10) ----------
      - name: Restore & Publish TrackerChecker
        run: |
          dotnet restore TrackerChecker.csproj
          dotnet publish TrackerChecker.csproj \
            -c Release \
            -r linux-x64 \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:EnableCompressionInSingleFile=true \
            -p:PublishReadyToRun=true \
            -o ./publish
          # 将可执行文件复制到工作目录根，便于后续调用
          cp ./publish/TrackerChecker ./tracker-checker
          chmod +x ./tracker-checker

      # ---------- 4. 运行检查器生成数据（public/ 目录） ----------
      - name: Run tracker checker
        run: |
          ./tracker-checker \
            -input webtracker/input_merged.txt \
            -workers 1000 \
            -retries 2 \
            -compact0-fallback \
            -insecure \
            -proxy socks5://localhost:4444 \
            -sam \
            -dns "223.5.5.5,119.29.29.29,114.114.114.114,1.1.1.1,8.8.8.8,4.2.2.1" \
            -doh \
            -doh-servers "https://dns.alidns.com/dns-query,https://cloudflare-dns.com/dns-query,https://dns.google/dns-query" \
            -dns-timeout 5s \
            -rate-limit 500 \
            -output public
          echo "Tracker check completed"

      # ---------- 5. 安装 Vue 依赖并构建前端 ----------
      - name: Install Vue dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Vue
        run: |
          cd frontend
          npm run build

      - name: Copy data files to dist
        run: |
          mkdir -p dist
          if [ -d "frontend/dist" ]; then
            mv frontend/dist/* dist/
          elif [ -d "dist" ]; then
            echo "dist already exists"
          else
            echo "ERROR: Vue build output not found"
            exit 1
          fi
          cp public/*.txt dist/ 2>/dev/null || true
          cp public/trackers.json dist/ 2>/dev/null || true
          if [ -f "robots.txt" ]; then
            cp robots.txt dist/
          fi

      # ---------- 6. 部署到 Cloudflare Pages ----------
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/ --project-name=${{ secrets.CF_PAGES_PROJECT_NAME }} --branch=${{ github.ref_name }}

      # ---------- 7. 提交更新的数据文件到仓库 ----------
      - name: Commit updated files
        run: |
          date +'%Y%m%d%H' > date.txt
          # C# 版输出在 public/ 下；同时保留根目录兼容路径（若存在）
          git add public/ date.txt 2>/dev/null || true
          git add trackers_all.txt trackers_best*.txt trackers_alive_*.txt \
                   trackers_peers.txt tracker_history.tsv 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes, skip commit."
            exit 0
          fi
          git commit -m "Update trackers $(date +'%Y-%m-%d %H:%M') [skip ci]"
          for i in 1 2 3; do
            git pull --rebase --autostash origin ${{ github.ref_name }} && git push && break
            sleep 5
          done