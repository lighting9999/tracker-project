name: Tracker Check and Deploy

on:
  push:
  schedule:
    - cron: '0 */16 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tracker-pipeline
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Configure Git
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"

      - name: Download and merge sources (curl)
        run: |
          mkdir -p webtracker/sources
          if [ -f "download_sources.txt" ]; then
            count=0
            while IFS= read -r url; do
              [[ -z "$url" || "$url" =~ ^# ]] && continue
              count=$((count+1))
              filename="source_${count}.txt"
              echo "⬇️ Downloading: $url → webtracker/sources/$filename"
              curl -sS --retry 2 --max-time 30 "$url" -o "webtracker/sources/$filename" || \
                echo "⚠️ Failed: $url"
            done < download_sources.txt
          fi

          true > webtracker/input_merged_raw.txt
          if [ -d "webtracker/sources" ]; then
            cat webtracker/sources/*.txt >> webtracker/input_merged_raw.txt
          fi
          if [ -f "direct_trackers.txt" ]; then
            cat direct_trackers.txt >> webtracker/input_merged_raw.txt
          fi

          cat webtracker/input_merged_raw.txt \
            | sed 's/\r$//' \
            | tr ',' '\n' \
            | sed 's/[[:space:]]*#.*//' \
            | sed 's/^[[:space:]]*//; s/[[:space:]]*$//' \
            | sed '/^$/d' \
            | sort -u \
            > webtracker/input_merged.txt

          rm -f webtracker/input_merged_raw.txt
          echo "✅ Cleaned file has $(wc -l < webtracker/input_merged.txt) lines"

      - name: Build Go checker
        run: go build -o tracker-checker check_trackers.go

      - name: Run tracker checker (Go)
        run: ./tracker-checker -input webtracker/input_merged.txt -output trackers_best.txt -workers 100

      - name: Build Go docs generator
        run: go build -o build_docs build_docs.go

      - name: Prepare Hugo data and static files
        run: |
          mkdir -p hugo/static hugo/content/en/trackers hugo/content/zh/trackers
          # 创建必要的 Hugo 占位文件（如不存在）
          if [ ! -f hugo/content/en/_index.md ]; then
            echo -e "---\ntitle: English\n---" > hugo/content/en/_index.md
          fi
          if [ ! -f hugo/content/zh/_index.md ]; then
            echo -e "---\ntitle: 中文\n---" > hugo/content/zh/_index.md
          fi
          if [ ! -f hugo/content/trackers/_index.md ]; then
            echo -e "---\ntitle: Trackers\n---" > hugo/content/trackers/_index.md
          fi
          ./build_docs --trackers-all trackers_all.txt \
                       --trackers-best trackers_best.txt \
                       --history tracker_history.tsv \
                       --output-dir hugo
          cp trackers_all.txt trackers_best*.txt hugo/static/

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.126.0'
          extended: true

      - name: Build Hugo site
        run: |
          cd hugo
          hugo --destination ../public

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public/ --project-name=${{ secrets.CF_PAGES_PROJECT_NAME }} --branch=${{ github.ref_name }}

      - name: Commit updated files
        run: |
          date +'%Y%m%d%H' > date.txt
          rm -rf source/ docs/ public/ hugo/public/
          git add trackers_all.txt trackers_best*.txt tracker_history.tsv date.txt
          if git diff --cached --quiet; then
            echo "No changes, skip commit."
            exit 0
          fi
          git commit -m "Update trackers $(date +'%Y-%m-%d %H:%M') [skip ci]"
          for i in 1 2 3; do
            git pull --rebase --autostash origin ${{ github.ref_name }} && git push && break
            sleep 5
          done
