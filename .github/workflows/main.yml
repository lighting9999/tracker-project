name: Tracker Check and Deploy

on:
  push:
  schedule:
    - cron: '0 */16 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tracker-pipeline
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    services:
      i2pd:
        image: purplei2p/i2pd:latest
        ports:
          - 4444:4444
          - 7656:7656
        env:
          I2PD_SAM_ENABLED: "true"
        options: >-
          --health-cmd "nc -z 127.0.0.1 4444 && nc -z 127.0.0.1 7656 || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 6

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Harden Runner (allow all egress)
        uses: step-security/harden-runner@v2
        with:
          egress-policy: block
          allowed-endpoints: "*"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Tune network (UDP stability)
        uses: smorimoto/tune-github-hosted-runner-network@v1

      - name: Configure Git
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"

      - name: Download and merge sources
        run: |
          mkdir -p webtracker/sources
          if [ -f "download_sources.txt" ]; then
            count=0
            while IFS= read -r url; do
              [[ -z "$url" || "$url" =~ ^# ]] && continue
              count=$((count+1))
              filename="source_${count}.txt"
              echo "⬇️ Downloading: $url → webtracker/sources/$filename"
              curl -sS --retry 2 --max-time 30 "$url" -o "webtracker/sources/$filename" || \
                echo "⚠️ Failed: $url"
            done < download_sources.txt
          fi

          true > webtracker/input_merged_raw.txt
          if [ -d "webtracker/sources" ]; then
            cat webtracker/sources/*.txt >> webtracker/input_merged_raw.txt
          fi
          if [ -f "direct_trackers.txt" ]; then
            cat direct_trackers.txt >> webtracker/input_merged_raw.txt
          fi

          sed -i 's/\(https\?:\/\/\|udp:\/\/\|ws:\/\/\|wss:\/\/\|dns:\/\/\)/\n\1/g' webtracker/input_merged_raw.txt

          cat webtracker/input_merged_raw.txt \
            | sed 's/\r$//' \
            | tr ',' '\n' \
            | sed 's/[[:space:]]*#.*//' \
            | sed 's/^[[:space:]]*//; s/[[:space:]]*$//' \
            | sed '/^$/d' \
            | sed '/?/! s|/announce[+ ][0-9]\{1,\}.*$|/announce|' \
            | grep -i "announce" \
            | sort -u \
            > webtracker/input_merged.txt

          rm -f webtracker/input_merged_raw.txt
          echo "✅ Cleaned file has $(wc -l < webtracker/input_merged.txt) lines"

      - name: Setup Go modules and build
        env:
          GOPROXY: "https://goproxy.cn,direct"
          GOSUMDB: "sum.golang.google.cn"
          GOCACHE: "/tmp/go-cache"
        run: |
          if [ ! -f "go.mod" ]; then
            go mod init tracker-checker
          fi
          go mod tidy
          go mod download
          CGO_ENABLED=0 go build -v -ldflags="-s -w" -trimpath -gcflags="-l=4" -p 4 -o check_http script/check_http.go
          CGO_ENABLED=0 go build -v -ldflags="-s -w" -trimpath -gcflags="-l=4" -p 4 -o check_udp_wss script/check_udp_wss.go
          CGO_ENABLED=0 go build -v -ldflags="-s -w" -trimpath -gcflags="-l=4" -p 4 -o merge script/merge.go

      - name: Run HTTP/HTTPS/I2P checker
        run: |
          ./check_http \
            -input webtracker/input_merged.txt \
            -workers 1000 \
            -retries 1 \
            -compact0-fallback \
            -insecure \
            -proxy socks5://localhost:4444 \
            -sam \
            -dns 1.1.1.1 \
            -dns-timeout 5s \
            -rate-limit 2000 \
            -shards 4
          echo "HTTP/HTTPS/I2P check completed"

      - name: Run UDP+WSS checker
        run: |
          ./check_udp_wss \
            -input webtracker/input_merged.txt \
            -workers 150 \
            -retries 1 \
            -insecure \
            -proxy socks5://localhost:4444 \
            -dns 1.1.1.1 \
            -dns-timeout 5s \
            -rate-limit 2000 \
            -shards 4
          echo "UDP+WSS check completed"

      - name: Merge results
        run: |
          ./merge -input webtracker/input_merged.txt
          echo "Merge completed"

      - name: Download Bootstrap and assets
        run: |
          mkdir -p jekyll/assets/css jekyll/assets/js
          curl -sS -o jekyll/assets/css/bootstrap.min.css \
            https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css
          curl -sS -o jekyll/assets/js/bootstrap.bundle.min.js \
            https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js

      - name: Setup Ruby and Jekyll
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: jekyll

      - name: Build Jekyll site
        run: |
          cd jekyll
          bundle install
          bundle exec jekyll build --destination ../public

      - name: Copy tracker download files to public
        run: |
          cp trackers_all.txt trackers_best*.txt trackers_alive_*.txt public/ 2>/dev/null || true
          if [ -f trackers_peers.txt ]; then cp trackers_peers.txt public/; fi
          cp trackers_best_http.txt trackers_best_https.txt trackers_best_i2p.txt \
             trackers_best_udp.txt trackers_best_ws.txt public/ 2>/dev/null || true

      - name: Generate robots.txt and commit to repo
        run: |
          cat > robots.txt <<EOF
          User-agent: *
          Allow: /
          Sitemap: https://tracker-list.pages.dev/sitemap.xml
          EOF
          cp robots.txt public/
          git add robots.txt

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public/ --project-name=${{ secrets.CF_PAGES_PROJECT_NAME }} --branch=${{ github.ref_name }}

      - name: Commit updated files
        run: |
          date +'%Y%m%d%H' > date.txt
          rm -rf public/ _site/ jekyll/_site/
          git add trackers_all.txt trackers_best*.txt trackers_alive_*.txt \
                   trackers_peers.txt tracker_history.tsv date.txt robots.txt \
                   jekyll/_data/trackers.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes, skip commit."
            exit 0
          fi
          git commit -m "Update trackers $(date +'%Y-%m-%d %H:%M') [skip ci]"
          for i in 1 2 3; do
            git pull --rebase --autostash origin ${{ github.ref_name }} && git push && break
            sleep 5
          done