name: Cleanup Cloudflare Pages Deployments

on:
  workflow_dispatch:                          # 仅手动触发
    inputs:
      keep:
        description: '要保留的最近部署数量'
        required: true
        default: '5'
        type: string

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
            run: pip install requests
      - name: Run deployment cleanup script
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PAGES_PROJECT_NAME: ${{ secrets.CF_PAGES_PROJECT_NAME }}
          KEEP_DEPLOYMENTS: ${{ github.event.inputs.keep }}
        run: |
          import os, requests, time

          API_TOKEN = os.environ['CLOUDFLARE_API_TOKEN']
          ACCOUNT_ID = os.environ['CLOUDFLARE_ACCOUNT_ID']
          PROJECT_NAME = os.environ['CF_PAGES_PROJECT_NAME']
          KEEP = int(os.environ['KEEP_DEPLOYMENTS'])

          BASE_URL = f"https://api.cloudflare.com/client/v4/accounts/{ACCOUNT_ID}/pages/projects/{PROJECT_NAME}/deployments"
          HEADERS = {"Authorization": f"Bearer {API_TOKEN}", "Content-Type": "application/json"}

          def list_deployments():
              deployments = []
              page = 1
              per_page = 25
              while True:
                  resp = requests.get(BASE_URL, headers=HEADERS, params={"page": page, "per_page": per_page})
                  data = resp.json()
                  if not data.get("success"):
                      print(f"Failed to fetch deployments: {data}")
                      break
                  batch = data["result"]
                  if not batch:
                      break
                  deployments.extend(batch)
                  page += 1
              return deployments

          def delete_deployment(did):
              url = f"{BASE_URL}/{did}"
              resp = requests.delete(url, headers=HEADERS)
              if resp.status_code == 200:
                  print(f"Deleted deployment: {did}")
              else:
                  print(f"Failed to delete {did}: {resp.json()}")

          deployments = list_deployments()
          deployments.sort(key=lambda d: d["created_on"], reverse=True)
          to_delete = deployments[KEEP:]
          print(f"Found {len(deployments)} deployments, keeping last {KEEP}, deleting {len(to_delete)}...")

          for dep in to_delete:
              delete_deployment(dep["id"])
              time.sleep(0.2)  # 避免触发限流

          print("Cleanup completed!")
        shell: python