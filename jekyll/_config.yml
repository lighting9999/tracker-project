title: "Tracker Status"
description: "Global public BitTorrent tracker availability dashboard"
baseurl: ""
url: "https://tracker-list.pages.dev"

# SEO 与索引
lang: en
plugins:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-seo-tag

# jekyll-seo-tag 默认配置
social:
  name: "Tracker Status"
  links:
    - "https://github.com/lighting9999/tracker-list"

# 确保所有页面可被索引
defaults:
  - scope:
      path: ""
    values:
      layout: page
      robots: "index, follow"

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - .gitignore
  - script/
  - webtracker/