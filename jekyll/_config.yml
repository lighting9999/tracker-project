title: Tracker Status
description: BitTorrent tracker availability report
baseurl: ""
url: "https://tracker-project.pages.dev"

theme: jekyll-text-theme
text_skin: ocean
highlight_theme: default

lang: en

destination: _site

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - .gitignore

# 开启侧边栏和头部导航
texts:
  sidebar:
    nav: all

# 默认页面布局
defaults:
  - scope:
      path: ""
    values:
      layout: page