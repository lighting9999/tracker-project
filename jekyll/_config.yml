title: Tracker Status
description: BitTorrent tracker availability report
baseurl: ""
url: "https://tracker-project.pages.dev"

theme: jekyll-text-theme
text_skin: ocean
highlight_theme: default

plugins:
  - jekyll-sitemap
  - jekyll-seo-tag

lang: en
destination: _site

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - .gitignore

texts:
  sidebar:
    nav: all

defaults:
  - scope:
      path: ""
    values:
      layout: page